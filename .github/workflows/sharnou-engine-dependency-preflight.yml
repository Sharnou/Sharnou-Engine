      - name: Validate PowerShell syntax
        shell: pwsh
        continue-on-error: false
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE $env:PREFLIGHT_SCRIPT
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw 'Preflight script is missing.'
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              Write-Host 'ACTUAL POWERSHELL PARSER: FAILED'
              foreach ($parseError in $parseErrors) {
                  Write-Host $parseError.ToString()
              }
              exit 1
          }
          Write-Host 'ACTUAL POWERSHELL PARSER: PASSED'

      - name: Generate and run dependency preflight
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE $env:REPORT_DIR
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE $env:PREFLIGHT_SCRIPT
          New-Item -ItemType Directory -Force -Path $reportDirectory | Out-Null
          try {
              if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
                  throw 'Preflight script is missing.'
              }
              & $scriptPath | Out-Null
          }
          catch {
              $failureReason = $_.Exception.Message
              $checkedOutCommit = 'UNKNOWN'
              try {
                  $checkedOutCommit = (git rev-parse HEAD).Trim()
              }
              catch {
                  $checkedOutCommit = 'UNKNOWN'
              }
              $fallbackJson = [ordered]@{
                  Schema = 'sharnou-engine-dependency-preflight/v1'
                  Mode = 'READ_ONLY'
                  Repository = $env:TARGET_REPOSITORY
                  ExpectedCommit = $env:TARGET_COMMIT
                  CheckedOutCommit = $checkedOutCommit
                  WorkflowRunId = $env:GITHUB_RUN_ID
                  WorkflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
                  TimestampUtc = [DateTime]::UtcNow.ToString('o')
                  CompilerDiscovery = [ordered]@{
                      Discovered = $false
                      Candidates = @()
                      VersionMetadata = 'UNKNOWN'
                      Functionality = 'NOT TESTED'
                  }
                  LinkerDiscovery = [ordered]@{
                      Discovered = $false
                      Candidates = @()
                      VersionMetadata = 'UNKNOWN'
                      Functionality = 'NOT TESTED'
                  }
                  IncludeScan = [ordered]@{
                      Label = 'STATIC REPOSITORY-LOCAL INCLUDE SCAN'
                      WindowsSdkHeaders = 'DISCOVERED SEPARATELY'
                      ExternalHeaders = 'DISCOVERED SEPARATELY'
                      ConditionalCompilerIncludeResolution = 'NOT TESTED'
                      LocalIncludes = @()
                      ExternalIncludes = @()
                  }
                  RuntimeAssumptions = @()
                  Dependencies = @()
                  BlockingReasons = @("Preflight report generation error: $failureReason")
                  CompilerFunctionality = 'NOT TESTED'
                  LinkerFunctionality = 'NOT TESTED'
                  Compilation = 'NOT ATTEMPTED'
                  Linking = 'NOT ATTEMPTED'
                  Installation = 'NOT PERFORMED'
                  Download = 'NOT PERFORMED'
                  DependencyRestoration = 'NOT PERFORMED'
                  PackageManager = 'NOT INVOKED'
                  Packaging = 'NOT PERFORMED'
                  ExecutableGeneration = 'NOT ATTEMPTED'
                  Release = 'NOT PERFORMED'
                  FakeExecutableCreation = 'NOT PERFORMED'
                  Outcome = 'BLOCKED — DEPENDENCY DECISION REQUIRED'
              }
              $fallbackJsonPath = Join-Path $reportDirectory 'dependency-report.json'
              $fallbackMarkdownPath = Join-Path $reportDirectory 'dependency-report.md'
              $fallbackIncludePath = Join-Path $reportDirectory 'source-include-report.txt'
              $fallbackRuntimePath = Join-Path $reportDirectory 'runtime-assumptions-report.txt'
              $fallbackJson | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $fallbackJsonPath -Encoding UTF8
              $fallbackMarkdown = @(
                  '# Sharnou Engine Dependency Preflight'
                  ''
                  'BLOCKED — DEPENDENCY DECISION REQUIRED'
                  ''
                  "Preflight report generation error: $failureReason"
                  ''
                  'Compiler functionality: NOT TESTED'
                  'Linker functionality: NOT TESTED'
                  'Compilation: NOT ATTEMPTED'
                  'Linking: NOT ATTEMPTED'
                  'Installation: NOT PERFORMED'
                  'Dependency download: NOT PERFORMED'
                  'Dependency restoration: NOT PERFORMED'
                  'Package manager: NOT INVOKED'
                  'Packaging: NOT PERFORMED'
                  'Executable generation: NOT ATTEMPTED'
                  'Release: NOT PERFORMED'
              )
              $fallbackMarkdown | Set-Content -LiteralPath $fallbackMarkdownPath -Encoding UTF8
              $fallbackInclude = @(
                  'STATIC REPOSITORY-LOCAL INCLUDE SCAN'
                  'Windows SDK headers are discovered separately.'
                  'External headers are discovered separately.'
                  'Conditional compiler include resolution NOT TESTED.'
                  ''
                  'Preflight report generation failed before include scanning.'
              )
              $fallbackInclude | Set-Content -LiteralPath $fallbackIncludePath -Encoding UTF8
              $fallbackRuntime = @(
                  'RUNTIME ASSUMPTIONS REPORT'
                  'Preflight report generation failed before runtime scanning.'
                  'Runtime execution was NOT PERFORMED.'
              )
              $fallbackRuntime | Set-Content -LiteralPath $fallbackRuntimePath -Encoding UTF8
          }
          $jsonPath = Join-Path $reportDirectory 'dependency-report.json'
          if (-not (Test-Path -LiteralPath $jsonPath -PathType Leaf)) {
              throw 'dependency-report.json was not produced.'
          }
          $preflightReport = Get-Content -LiteralPath $jsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($preflightReport.Outcome -eq 'READY FOR APPROVED BUILD DESIGN') {
              Write-Host 'READY FOR APPROVED BUILD DESIGN'
              exit 0
          }
          Write-Host 'BLOCKED — DEPENDENCY DECISION REQUIRED'
          exit 1

      - name: Upload all preflight reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharnou-engine-dependency-preflight-${{ github.run_id }}
          path: preflight-reports
          if-no-files-found: error
          retention-days: 14

      - name: Enforce final outcome after report upload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jsonPath = Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:REPORT_DIR) 'dependency-report.json'
          if (-not (Test-Path -LiteralPath $jsonPath -PathType Leaf)) {
              Write-Host 'BLOCKED — DEPENDENCY DECISION REQUIRED'
              exit 1
          }
          $report = Get-Content -LiteralPath $jsonPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.Outcome -eq 'READY FOR APPROVED BUILD DESIGN') {
              Write-Host 'READY FOR APPROVED BUILD DESIGN'
              exit 0
          }
          Write-Host 'BLOCKED — DEPENDENCY DECISION REQUIRED'
          exit 1
