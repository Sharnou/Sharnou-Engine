name: Sharnou Engine Windows Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT -and $env:VCPKG_INSTALLATION_ROOT) {
            "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          }
          if (-not $env:VCPKG_ROOT) {
            $candidate = Join-Path $env:ProgramFiles "Microsoft Visual Studio/2022/Enterprise/VC/vcpkg"
            if (Test-Path $candidate) { "VCPKG_ROOT=$candidate" >> $env:GITHUB_ENV }
          }
          if (-not $env:VCPKG_ROOT -and (Test-Path "C:/vcpkg/vcpkg.exe")) {
            "VCPKG_ROOT=C:/vcpkg" >> $env:GITHUB_ENV
          }

      - name: Ensure vcpkg exists
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) { throw "VCPKG_ROOT is unavailable on this runner." }
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-release

      - name: Build
        shell: pwsh
        run: cmake --build build/vs2022-release --config Release --parallel

      - name: Size guard
        shell: pwsh
        run: ./tools/size_guard.ps1
