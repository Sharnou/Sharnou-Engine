name: Sharnou Engine Windows Policy

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  sharnou-only-validation:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Sharnou-only build policy
        shell: pwsh
        run: ./tools/sharnou-policy.ps1

      - name: Validate canonical engine contract
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/branding/SHARNOU_ENGINE_LOGO_LOCK.md")) { throw "Canonical Sharnou Engine logo lock missing." }
          if (-not (Test-Path "assets/textures/README.md")) { throw "AVIF texture boundary missing." }
          if (-not (Test-Path "toolchain/sharnou-toolchain.contract.json")) { throw "Sharnou toolchain contract missing." }
          if (-not (Test-Path "SHARNOU_IDE_INTEGRATION.json")) { throw "Sharnou IDE integration contract missing." }
          Write-Host "PASS: canonical Sharnou Engine identity and AVIF boundary present."
          Write-Host "PASS: Sharnou IDE and Sharnou toolchain contracts present."

      - name: Validate approved runtime when present
        shell: pwsh
        run: |
          $candidates = @(
            "$env:GITHUB_WORKSPACE/Build/Runtime/SharnouEngine.exe",
            "$env:GITHUB_WORKSPACE/Engine/SharnouEngine/bin/SharnouEngine.exe",
            "$env:GITHUB_WORKSPACE/Tools/SharnouIDE/runtime/SharnouEngine.exe"
          )
          $engine = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($engine) {
            $env:SHARNOU_IDE_SESSION = '1'
            $env:SHARNOU_IDE_REPOSITORY = 'https://github.com/Sharnou/Sharnou-IDE'
            $env:SHARNOU_ENGINE_ID = 'SharnouEngine'
            $env:SHARNOU_PROJECT_ID = 'honour-war'
            & $engine '--self-test'
            if ($LASTEXITCODE -ne 0) { throw "Sharnou Engine self-test failed: $LASTEXITCODE" }
            Write-Host "PASS: approved Sharnou Engine runtime self-test."
          } else {
            Write-Host "INFO: no runtime binary is checked into the source tree; no compiler/toolchain is downloaded."
          }
